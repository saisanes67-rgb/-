<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e40af">
<title>متوسطة عيسات بن عودة | دروس وملخصات</title>

<script>try{var t=localStorage.theme||'auto';document.documentElement.dataset.theme=t==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f7ff;--card:#fff;--ink:#10203a;--mut:#5a6d92;--line:#d6e0f5;--blue:#2563eb;--sky:#e8f0ff;--sun:#ffb703;--sh:0 8px 28px rgba(30,64,175,.12)}
[data-theme=dark]{--bg:#0b1226;--card:#131c36;--ink:#e8eefc;--mut:#93a4c9;--line:#25335a;--blue:#5b9bff;--sky:#1a2850;--sh:0 8px 28px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
h1{font-size:clamp(22px,5vw,30px);margin:.2em 0}h2{font-size:19px;margin:26px 0 12px}
.mut{color:var(--mut);font-size:14px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.brand svg{width:34px;height:34px;flex:none}.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn,button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:10px 18px;background:var(--blue);color:#fff;transition:transform .15s,opacity .2s;display:inline-block}
.btn:active,button:active{transform:scale(.95)}
button:disabled{opacity:.6;cursor:not-allowed}
.ghost{background:var(--sky);color:var(--blue)}.del{background:#fee2e2;color:#b91c1c}
.ib{width:40px;height:40px;padding:0;display:grid;place-items:center}
.i{width:1.25em;height:1.25em;flex:none;vertical-align:-.25em}
.ib .i{width:22px;height:22px}
.ic{color:var(--blue)}.ic .i,.src .i{width:28px;height:28px}
.tile .i,.th .i{width:26px;height:26px}.tile .i,.th .i,h1 .i{color:var(--blue)}
.seg button{display:flex;gap:5px;justify-content:center;align-items:center}.seg .i{width:16px;height:16px}
.pw .i{width:20px;height:20px}
.btn .i{margin-inline-end:6px}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
main{max-width:860px;margin:0 auto;padding:18px 16px 56px}
.page{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.stagger>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(55px);opacity:.3;animation:drift 14s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:260px;height:260px;background:var(--blue);top:-60px;right:-60px}
.blobs i:nth-child(2){width:220px;height:220px;background:var(--sun);bottom:6%;left:-70px;animation-delay:-5s}
.blobs i:nth-child(3){width:180px;height:180px;background:#8b5cf6;top:45%;right:28%;opacity:.15;animation-delay:-9s}
@keyframes drift{to{transform:translate(40px,-50px) scale(1.15)}}
.stage{text-align:center;padding:18px 0 6px}
.logo{width:116px;height:116px;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 12px 16px rgba(37,99,235,.35))}
@keyframes float{50%{transform:translateY(-8px) rotate(-3deg)}}
.roles{display:grid;gap:14px;margin-top:8px}
.role{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--sh);transition:transform .2s,border-color .2s}
.role:hover{transform:translateY(-3px);border-color:var(--blue)}.role:active{transform:scale(.98)}
.ic{width:56px;height:56px;border-radius:16px;background:var(--sky);display:grid;place-items:center;font-size:28px;flex:none}
.role b{display:block;font-size:19px}.role small{display:block;color:var(--mut);font-size:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.levels{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tile{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;font-weight:700;box-shadow:var(--sh);transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--blue)}.tile:active{transform:scale(.97)}
.tile em{font-style:normal;font-size:26px}
.lv{font-size:18px;padding:18px}.lv b{font-size:46px;line-height:1;color:var(--blue);min-width:34px;text-align:center}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;animation:rise .4s both}
.th{width:60px;height:60px;border-radius:12px;background:var(--sky);display:grid;place-items:center;font-size:26px;object-fit:cover;flex:none}
.info{flex:1;min-width:0}.info strong{display:block;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:14px;box-shadow:var(--sh);max-width:460px;margin:18px auto}
label{display:grid;gap:5px;font-weight:600;font-size:15px}
input,select{font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
input:focus,select:focus{border-color:var(--blue);outline:0;box-shadow:0 0 0 4px rgba(37,99,235,.2)}
.pw{position:relative}.pw button{position:absolute;top:4px;bottom:4px;left:4px;padding:0 12px;transform:none!important}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.spin{display:inline-block;width:16px;height:16px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-3px;margin-inline-end:8px}
@keyframes rot{to{transform:rotate(1turn)}}
#msg{margin:0;min-height:1.6em;font-weight:600}
.pop{display:inline-block;animation:pop .5s}@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.src{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.src button{display:grid;gap:2px;justify-items:center;padding:14px 4px;background:var(--sky);color:var(--blue);font-size:14px}
.src button.on{background:var(--blue);color:#fff}.src span{font-size:28px}
.prev{width:100%;max-height:260px;object-fit:contain;border-radius:14px;background:#0003;animation:pop .4s}
.item{flex-wrap:wrap}.item select{width:auto;flex:1;min-width:150px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.sheet{position:fixed;top:62px;left:12px;width:min(300px,calc(100% - 24px));z-index:30;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);transform-origin:top left;transform:scale(.9);opacity:0;pointer-events:none;transition:.2s}
.sheet.open{transform:none;opacity:1;pointer-events:auto}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.seg button{padding:8px 4px;font-size:13px;background:var(--sky);color:var(--blue)}.seg button.on{background:var(--blue);color:#fff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blobs"><i></i><i></i><i></i></div>
<header>
  <button class="ghost ib" id="back" aria-label="رجوع" hidden></button>
  <a class="brand" href="#/" id="brand"></a>
  <button class="ghost ib" id="gear" aria-label="الإعدادات"></button>
</header>
<div class="sheet" id="sheet"><b>المظهر</b>
  <div class="seg"><button data-t="light">فاتح</button><button data-t="dark">داكن</button><button data-t="auto">تلقائي</button></div>
</div>
<main id="app"></main>
<script>
const sb=supabase.createClient('https://tebctllaushjrqefsxlx.supabase.co','sb_publishable_USJaeacXB5QBisADVQ_rOg_Y8K18pAe');
const MAIL='@aissat-benaouda.dz';
const LEVELS=['السنة الأولى متوسط','السنة الثانية متوسط','السنة الثالثة متوسط','السنة الرابعة متوسط'];
const SUBJECTS=['اللغة العربية','اللغة الفرنسية','اللغة الإنجليزية','الرياضيات','العلوم الفيزيائية والتكنولوجيا','العلوم الطبيعية والحياة','التربية الإسلامية','التربية المدنية','التاريخ','الجغرافيا','التربية التشكيلية','التربية البدنية والرياضية'];
const I={
back:'<path d="M5 12h14M13 6l6 6-6 6"/>',
sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
board:'<path d="M3 4h18M5 4v10h14V4M12 14v4M8 21l4-3 4 3"/>',
cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5M22 9v6"/>',
pen:'<path d="M4 20l1-4L17 4l3 3L8 19z"/><path d="M14 7l3 3"/>',
book:'<path d="M2 5c3-1 7-1 10 2 3-3 7-3 10-2v13c-3-1-7-1-10 2-3-3-7-3-10-2z"/><path d="M12 7v13"/>',
chat:'<path d="M4 5h16v11H10l-4 4v-4H4z"/>',
calc:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/>',
atom:'<circle cx="12" cy="12" r="1.5"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/>',
leaf:'<path d="M5 19c0-9 5-14 15-15 0 10-5 15-14 15z"/><path d="M5 19c3-5 6-8 10-10"/>',
moon:'<path d="M12 3a6 6 0 009 9 9 9 0 11-9-9z"/>',
scale:'<path d="M12 3v18M6 21h12M5 7h14"/><path d="M5 7l-3 7a3 3 0 006 0zM19 7l-3 7a3 3 0 006 0z"/>',
columns:'<path d="M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 21h18"/>',
globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
palette:'<path d="M12 3a9 9 0 100 18c1.5 0 2-1 2-2s-1-1.5-1-3 1-2 2.5-2H18a3 3 0 003-3c0-5-4-8-9-8z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>',
ball:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18"/><path d="M5.5 5.5c4 3 4 10 0 13M18.5 5.5c-4 3-4 10 0 13"/>',
eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
eyeoff:'<path d="M3 3l18 18M10.6 5.2A10 10 0 0112 5c6 0 10 7 10 7a17 17 0 01-3.2 4M6.5 6.7C3.7 8.6 2 12 2 12s4 7 10 7c1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 004.2 4.2"/>',
camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
video:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/>',
image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/>',
file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
half:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 010 18z" fill="currentColor"/>',
download:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]||''}</svg>`;
const ICONS=['pen','book','chat','calc','atom','leaf','moon','scale','columns','globe','palette','ball'];
const KINDS={lesson:'درس',summary:'ملخص'};
const ROLES=[['#/login/admin','shield','صاحب الموقع','مراقبة المحتوى وحذف ما لا يليق'],['#/login/teacher','board','أستاذ','ارفع دروسك وملخصاتك'],['#/student','cap','تلميذ','تصفّح الدروس بدون تسجيل دخول']];
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const logo=c=>`<svg class="${c||''}" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="95" fill="#2563eb" stroke="#fff" stroke-width="6"/><g transform="translate(100,96)" fill="#fff"><path d="M-70-14L0-42 70-14 0 14Z"/><path d="M-40 1V34C-40 34-20 50 0 50S40 34 40 34V1L0 24Z"/><path d="M62-9V36" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="62" cy="40" r="5"/></g></svg>`;
$('#brand').innerHTML=logo()+'<span>متوسطة عيسات بن عودة</span>';
$('#back').innerHTML=ic('back');$('#gear').innerHTML=ic('sliders');
document.querySelectorAll('.seg button').forEach(b=>b.insertAdjacentHTML('afterbegin',ic({light:'sun',dark:'moon',auto:'half'}[b.dataset.t])));
const opts=(a,f)=>a.map((x,i)=>`<option value="${f?f(i):x}">${x}</option>`).join('');
const fileUrl=(p,dl)=>sb.storage.from('lessons').getPublicUrl(p,dl?{download:dl}:undefined).data.publicUrl;
const when=d=>new Date(d).toLocaleDateString('ar-DZ');
const EXT=p=>p.split('.').pop().toLowerCase();
const isImg=p=>/^(jpe?g|png|webp|gif)$/.test(EXT(p)),isVid=p=>/^(mp4|webm|mov|3gp|m4v)$/.test(EXT(p));

/* المظهر والإعدادات */
function setTheme(t){localStorage.theme=t;document.documentElement.dataset.theme=t==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
setTheme(localStorage.theme||'auto');
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
$('#gear').onclick=e=>{e.stopPropagation();$('#sheet').classList.toggle('open')};
document.addEventListener('click',e=>{if(!e.target.closest('#sheet'))$('#sheet').classList.remove('open')});

/* الحساب */
let me=null,role=null,mySubject=null;
async function loadMe(){const {data:{session}}=await sb.auth.getSession();me=session?.user||null;role=null;mySubject=null;
  if(me){const {data}=await sb.from('profiles').select('role,subject').eq('id',me.id).maybeSingle();role=data?.role||'teacher';mySubject=data?.subject||null}}
const uname=()=>me?.email?.split('@')[0]||'';
async function logout(){await sb.auth.signOut();me=role=null;sessionStorage.clear();location.hash='#/'}

/* التنقل */
const stack=[];
function track(h){const n=stack.length;if(stack[n-1]===h)return;if(stack[n-2]===h)stack.pop();else stack.push(h)}
$('#back').onclick=()=>{stack.pop();location.hash=stack.pop()||'#/'};
function show(h){app.innerHTML=h;app.classList.remove('page');void app.offsetWidth;app.classList.add('page')}

function item(l,where){
  const u=fileUrl(l.file_path),dl=fileUrl(l.file_path,((l.title||'').replace(/[\\/:*?"<>|]/g,'').trim()||'lesson')+'.'+EXT(l.file_path)),own=me&&(role==='admin'||me.id===l.teacher_id);
  const th=isImg(l.file_path)?`<img class="th" src="${u}" alt="" loading="lazy">`:`<div class="th">${ic(isVid(l.file_path)?'video':'file')}</div>`;
  const place=where?` • ${LEVELS[l.level-1]} • ${esc(l.subject)}`:'';
  return `<li class="item">${th}<div class="info"><strong>${esc(l.title)}</strong><div class="mut">${KINDS[l.kind]} • ${esc(l.teacher_name)} • ${when(l.created_at)}${place}</div></div>
  <div class="acts"><a class="btn ghost" href="${u}" target="_blank" rel="noopener">${isVid(l.file_path)?'مشاهدة':'فتح'}</a><a class="btn" href="${dl}">${ic('download')}تنزيل</a>${own?`<button class="del" data-del="${l.id}" data-path="${esc(l.file_path)}">حذف</button>`:''}</div></li>`;
}

/* صفحات التلميذ */
function welcome(){
  const h=new Date().getHours(),hi=h<12?'صباح الخير':h<18?'طاب يومك':'مساء الخير';
  show(`<section class="stage stagger">${logo('logo')}<h1 style="--i:1">متوسطة عيسات بن عودة</h1><p class="mut" style="--i:2">${hi}! دروس وملخصات جميع المواد لكل الأطوار المتوسطة</p></section>
  <h2 style="text-align:center">من أنت؟</h2>
  <div class="roles stagger">${ROLES.map((r,i)=>`<a class="role" style="--i:${i+3}" href="${r[0]}"><div class="ic">${ic(r[1])}</div><div><b>${r[2]}</b><small>${r[3]}</small></div></a>`).join('')}</div>`);
}
function levels(){
  show(`<h1>في أي طور أنت؟</h1><div class="grid levels stagger">${LEVELS.map((n,i)=>`<a class="tile lv" style="--i:${i}" href="#/l/${i+1}"><b>${i+1}</b><span>${n}</span></a>`).join('')}</div>`);
}
function subjects(L){
  if(!LEVELS[L-1])return welcome();
  show(`<div class="mut">${LEVELS[L-1]}</div><h1>أي مادة تريد؟</h1><div class="grid stagger">${SUBJECTS.map((s,i)=>`<a class="tile" style="--i:${i}" href="#/l/${L}/s/${i}">${ic(ICONS[i])}<span>${s}</span></a>`).join('')}</div>`);
}
async function lessons(L,S){
  if(!LEVELS[L-1]||!SUBJECTS[S])return welcome();
  const head=`<div class="mut">${LEVELS[L-1]}</div><h1>${ic(ICONS[S])} ${SUBJECTS[S]}</h1>`;
  show(head+'<p class="mut"><i class="spin" style="border-color:#0003;border-top-color:var(--blue)"></i>جارٍ التحميل…</p>');
  const {data,error}=await sb.from('lessons').select('*').eq('level',L).eq('subject',SUBJECTS[S]).order('created_at',{ascending:false});
  if(error)return show(head+'<p>تعذر تحميل الدروس. تحقق من الاتصال وأعد المحاولة.</p>');
  const sec=(k,t)=>{const a=data.filter(x=>x.kind===k);return `<h2>${t}</h2>`+(a.length?`<ul class="list">${a.map(x=>item(x)).join('')}</ul>`:`<p class="mut">لا توجد ${t} بعد.</p>`)};
  show(head+sec('lesson','الدروس')+sec('summary','الملخصات'));
}

/* تسجيل الدخول */
const lockLeft=()=>Math.max(0,Math.ceil(((+localStorage.lockUntil)||0)/1000-Date.now()/1000));
function fail(form,msg,A){
  const n=(+localStorage.fails||0)+1;localStorage.fails=n;
  form.classList.remove('shake');void form.offsetWidth;form.classList.add('shake');
  if(n>=3){localStorage.lockUntil=Date.now()+30000*2**Math.min(n-3,5);msg.textContent='محاولات خاطئة كثيرة، تم إيقاف الدخول مؤقتاً.'}
  else msg.textContent=`اسم المستخدم أو كلمة السر ${A?'':'أو المادة '}غير صحيحة. بقيت ${3-n} محاولة.`;
}
function login(r){
  const A=r==='admin';
  show(`<div class="stage stagger">${logo('logo')}<h1 style="--i:1">${A?'دخول صاحب الموقع':'دخول الأستاذ'}</h1><p class="mut" style="--i:2">متوسطة عيسات بن عودة</p></div>
  <form id="lg" class="card stagger">
    <label style="--i:3">اسم المستخدم<input name="u" required dir="ltr" autocapitalize="off" autocomplete="username" placeholder="ahmed"></label>
    <label style="--i:4">كلمة السر<div class="pw"><input name="p" type="password" required dir="ltr" autocomplete="current-password"><button type="button" class="ghost" id="eye" aria-label="إظهار كلمة السر">${ic('eye')}</button></div></label>
    ${A?'':`<label style="--i:5">أي مادة تدرّس؟<select name="s">${opts(SUBJECTS)}</select></label>`}
    <button id="go" style="--i:6">دخول</button><p id="msg" role="status" class="mut"></p>
  </form>`);
  const go=$('#go'),msg=$('#msg');
  const tick=()=>{if(!go.isConnected)return;const s=lockLeft();if(s>0){go.disabled=true;go.textContent=`انتظر ${s} ثانية`;setTimeout(tick,500)}else{go.disabled=false;go.textContent='دخول'}};tick();
  $('#eye').onclick=()=>{const i=$('[name=p]'),h=i.type==='password';i.type=h?'text':'password';$('#eye').innerHTML=ic(h?'eyeoff':'eye')};
  $('#lg').onsubmit=async e=>{
    e.preventDefault();if(lockLeft())return;
    const f=new FormData(e.target);go.disabled=true;go.innerHTML='<i class="spin"></i>جارٍ التحقق';msg.textContent='';
    const {error}=await sb.auth.signInWithPassword({email:f.get('u').trim().toLowerCase()+MAIL,password:f.get('p')});
    if(error){if(!error.status)msg.textContent='تعذر الاتصال بالخادم. تحقق من الإنترنت.';else fail(e.target,msg,A);return tick()}
    await loadMe();
    if(A&&role!=='admin'||!A&&role==='admin'){await sb.auth.signOut();me=role=null;msg.textContent=A?'هذا الحساب ليس حساب صاحب الموقع.':'هذا حساب صاحب الموقع، ادخل من خانة «صاحب الموقع».';return tick()}
    if(!A&&mySubject!==f.get('s')){const none=!mySubject;await sb.auth.signOut();me=role=mySubject=null;if(none)msg.textContent='لم تُحدَّد مادة هذا الحساب بعد، تواصل مع مدير الموقع.';else fail(e.target,msg,A);return tick()}
    localStorage.fails=0;
    location.hash=A?'#/admin':'#/teacher';
  };
}

/* صفحة الأستاذ */
async function teacher(flash=''){
  if(!mySubject){show('<h1>لم تُحدَّد مادتك بعد</h1><p class="mut">تواصل مع مدير الموقع ليحدد مادة حسابك.</p><p><button class="ghost" id="out">تسجيل الخروج</button></p>');$('#out').onclick=logout;return}
  const {data}=await sb.from('lessons').select('*').eq('teacher_id',me.id).order('created_at',{ascending:false});
  const rows=data||[];
  show(`<div class="mut">مرحباً ${esc(uname())}</div><h1>إضافة درس جديد</h1>
  <form id="up" class="card">
    <b>١. اختر الدرس</b>
    <div class="src"><button type="button" data-pick="ci">${ic('camera')}التقاط صورة</button><button type="button" data-pick="cv">${ic('video')}تصوير فيديو</button><button type="button" data-pick="gl">${ic('image')}من هاتفي</button></div>
    <input type="file" id="ci" accept="image/*" capture="environment" hidden>
    <input type="file" id="cv" accept="video/*" capture="environment" hidden>
    <input type="file" id="gl" accept="image/*,video/*,.pdf,.doc,.docx,.ppt,.pptx" hidden>
    <div id="pv"></div>
    <b>٢. معلومات الدرس</b>
    <label>عنوان الدرس<input name="title" required></label>
    <label>المستوى<select name="level">${opts(LEVELS,i=>i+1)}</select></label>
    <label>المادة<input value="${esc(mySubject)}" disabled></label><input type="hidden" name="subject" value="${esc(mySubject)}">
    <label>النوع<select name="kind"><option value="lesson">درس</option><option value="summary">ملخص</option></select></label>
    <label>اسمك كما يظهر للتلاميذ<input name="tname" required value="${esc(localStorage.tname||uname())}"></label>
    <button id="go">رفع الدرس</button><p id="msg" role="status">${flash}</p>
  </form>
  <h2>ما رفعته</h2>${rows.length?`<ul class="list">${rows.map(x=>item(x,true)).join('')}</ul>`:'<p class="mut">لم ترفع أي درس بعد.</p>'}
  <p><button class="ghost" id="out">تسجيل الخروج</button></p>`);
  $('#out').onclick=logout;
  let file=null;
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>$('#'+b.dataset.pick).click());
  ['ci','cv','gl'].forEach(id=>$('#'+id).onchange=e=>{
    file=e.target.files[0]||null;if(!file)return;
    ['ci','cv','gl'].forEach(o=>{if(o!==id)$('#'+o).value=''});
    const u=URL.createObjectURL(file);
    $('#pv').innerHTML=file.type.startsWith('image/')?`<img class="prev" src="${u}" alt="">`:file.type.startsWith('video/')?`<video class="prev" src="${u}" controls playsinline></video>`:`<p class="pop">${ic('file')} ${esc(file.name)}</p>`;
  });
  $('#up').onsubmit=async e=>{
    e.preventDefault();const fd=new FormData(e.target),msg=$('#msg'),go=$('#go');
    if(!file){msg.textContent='اختر صورة أو فيديو أو ملفاً أولاً.';return}
    if(file.size>50*1024*1024){msg.textContent='حجم الملف أكبر من 50 ميغابايت.';return}
    go.disabled=true;go.innerHTML='<i class="spin"></i>جارٍ الرفع';msg.textContent='';
    let ext=(file.name.includes('.')?EXT(file.name):(file.type.split('/')[1]||'bin')).replace(/[^a-z0-9]/g,'')||'bin';
    const path=`${fd.get('level')}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
    let r=await sb.storage.from('lessons').upload(path,file,{contentType:file.type||undefined});
    if(!r.error)r=await sb.from('lessons').insert({level:+fd.get('level'),subject:fd.get('subject'),kind:fd.get('kind'),title:fd.get('title').trim(),file_path:path,teacher_name:fd.get('tname').trim()});
    if(r.error){msg.textContent='تعذر الرفع: '+r.error.message;go.disabled=false;go.textContent='رفع الدرس';return}
    localStorage.tname=fd.get('tname').trim();
    teacher('<span class="pop">'+ic('check')+' تم رفع الدرس بنجاح</span>');
  };
}

/* صفحة صاحب الموقع */
async function admin(){
  const [a,tc]=await Promise.all([sb.from('lessons').select('*').order('created_at',{ascending:false}),sb.from('profiles').select('id,username,subject').eq('role','teacher').order('username')]);
  const rows=a.data||[],teachers=tc.data||[];
  show(`<div class="mut">مرحباً ${esc(uname())}</div><h1>لوحة صاحب الموقع</h1>
  <h2>الأساتذة ومواد حساباتهم</h2><p class="mut">كل أستاذ يدخل بمادته فقط. اختر مادة كل حساب ثم اضغط حفظ.</p>
  <ul class="list" id="tl">${teachers.length?teachers.map(x=>`<li class="item"><div class="info"><strong dir="ltr">${esc(x.username||'-')}</strong></div><select data-sid="${x.id}"><option value="">بدون مادة</option>${SUBJECTS.map(s=>`<option${s===x.subject?' selected':''}>${s}</option>`).join('')}</select><button data-save="${x.id}">حفظ</button></li>`).join(''):'<li class="mut">لا يوجد أساتذة بعد. أنشئ حساباً من Supabase.</li>'}</ul>
  <h2>الدروس المرفوعة</h2><p class="mut">احذف أي درس غير لائق أو مسيء.</p>
  <div class="filters"><select id="fl"><option value="">كل المستويات</option>${opts(LEVELS,i=>i+1)}</select><select id="fs"><option value="">كل المواد</option>${opts(SUBJECTS)}</select></div>
  <ul class="list" id="al"></ul><p><button class="ghost" id="out">تسجيل الخروج</button></p>`);
  const draw=()=>{const L=$('#fl').value,S=$('#fs').value,r=rows.filter(x=>(!L||x.level==L)&&(!S||x.subject===S));
    $('#al').innerHTML=r.length?r.map(x=>item(x,true)).join(''):'<li class="mut">لا يوجد محتوى.</li>'};
  $('#fl').onchange=$('#fs').onchange=draw;draw();$('#out').onclick=logout;
  $('#tl').onclick=async e=>{
    const b=e.target.closest('[data-save]');if(!b)return;
    const s=document.querySelector(`[data-sid="${b.dataset.save}"]`);b.disabled=true;
    const {data,error}=await sb.from('profiles').update({subject:s.value||null}).eq('id',b.dataset.save).select();
    b.disabled=false;b.textContent=!error&&data?.length?'تم الحفظ':'تعذر الحفظ';setTimeout(()=>b.textContent='حفظ',1600);
  };
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-del]');
  if(!b||!confirm('حذف هذا الملف نهائياً؟'))return;
  b.disabled=true;
  const {error}=await sb.from('lessons').delete().eq('id',b.dataset.del);
  if(error){alert('تعذر الحذف.');b.disabled=false;return}
  await sb.storage.from('lessons').remove([b.dataset.path]);
  route();
});

function route(){
  const h=location.hash||'#/',p=h.slice(1).split('/').filter(Boolean);
  track(h);$('#back').hidden=!p.length;window.scrollTo(0,0);$('#sheet').classList.remove('open');
  if(!p.length)return welcome();
  if(p[0]==='student')return levels();
  if(p[0]==='l'&&p[2]==='s')return lessons(+p[1],+p[3]);
  if(p[0]==='l')return subjects(+p[1]);
  if(p[0]==='login'){if(me){stack.pop();history.replaceState(null,'',role==='admin'?'#/admin':'#/teacher');return route()}return login(p[1]==='admin'?'admin':'teacher')}
  if(p[0]==='teacher')return me&&role!=='admin'?teacher():login('teacher');
  if(p[0]==='admin')return me&&role==='admin'?admin():login('admin');
  welcome();
}
addEventListener('hashchange',route);
loadMe().then(route);
</script>
